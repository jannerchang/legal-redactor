[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-redactor"
version = "0.1.1"
description = "Fully local Chinese legal document redaction MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "cryptography>=41.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
hanlp = [
  "hanlp>=2.1",
  "transformers<5",
]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["legal_redactor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
